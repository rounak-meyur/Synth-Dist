[loggers]
keys=root,applicationLogger

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler, fileHandler

[logger_applicationLogger]
level=INFO
handlers=consoleHandler,fileHandler
qualname=applicationLogger
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=WARNING
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
# reopens the log file when a write fails (e.g. files synced by OneDrive)
class=utils.logging_utils.ReopeningFileHandler
level=INFO
formatter=simpleFormatter
args=('%(log_file_path)s', 'a')

[formatter_simpleFormatter]
format=%(asctime)-8s - %(name)-12s - %(levelname)-8s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S