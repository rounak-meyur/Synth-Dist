inputs:
  substation_csv: "data/substations.csv"

miscellaneous:
  log_dir: "logs/"
  intermediate_dir: "out/interim/"
  mapping_dir: "out/mapping/"
  stats_dir: "out/stats/"
  padding: 0.001
  # Ignore saved outputs and rerun every stage (same as the --from-scratch flag)
  from_scratch: false

osm:
  # Overpass API server for the road network downloads; use another public instance or
  # your own (https://github.com/drolbr/Overpass-API) when the default one is busy
  overpass_url: "https://overpass-api.de/api"
  # retries of a failed download: wait retry_wait seconds, doubled after every failure
  max_retries: 6
  retry_wait: 30

secnet:
  out_dir: "out/secnet/"
  secnet_args:
    separation: 50.0
    penalty: 0.5
    max_rating: 25000
    max_hops: 10
    # cvxpy MILP solved with SCIP/Gurobi (see configs/config_heuristic.yaml for the heuristic)
    method: milp
    parameters:
      solver: scip
      verbose: true
      time_limit: 600
      warm_start: true
      relative_gap: 0.05

primnet:
  out_dir: "out/primnet/"
  primnet_args:
    voltage_max: 1.05
    voltage_min: 0.90
    maximum_voltage_drop: 0.15
    conductor_resistance_per_km: 0.8625
    base_impedance: 39690
    maximum_branch_flow: 400
    max_feeder_number: 10
    max_feeder_capacity: 400
    # cvxpy MILP solved with SCIP (see configs/config_heuristic.yaml for the heuristic)
    method: milp
    parameters:
      solver: scip
      relative_gap: 0.05
      verbose: true
      warm_start: true
      threads: 0

finalnet:
  out_dir: "out/finalnet/"

figures:
  directory: "figs"
  combined_network: 
    filename: "combined_network.png"
  final_network:
    filename: "distribution_network.png"