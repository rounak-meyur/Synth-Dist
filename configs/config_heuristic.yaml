inputs:
  home_csv_dir: "data/load/"
  substation_csv: "data/substations.csv"

miscellaneous:
  log_dir: "logs/"
  intermediate_dir: "out/interim/"
  mapping_dir: "out/mapping/"
  stats_dir: "out/stats/"
  padding: 0.001
  # Ignore saved outputs and rerun every stage (same as the --from-scratch flag)
  from_scratch: false

secnet:
  out_dir: "out/secnet/"
  secnet_args:
    separation: 50.0
    penalty: 0.5
    max_rating: 25000
    max_hops: 10
    # Greedy construction + local search (see configs/config_milp.yaml for the MILP)
    method: heuristic
    parameters:
      max_iterations: 1000
      local_search: true

primnet:
  out_dir: "out/primnet/"
  primnet_args:
    voltage_max: 1.05
    voltage_min: 0.90
    maximum_voltage_drop: 0.15
    conductor_resistance_per_km: 0.8625
    base_impedance: 39690
    maximum_branch_flow: 400
    max_feeder_number: 10
    max_feeder_capacity: 400
    # Steiner tree + feeder splitting heuristic (see configs/config_milp.yaml for the MILP)
    method: heuristic
    parameters:
      feeder_voltage: 1.0
      local_search_passes: 20

finalnet:
  out_dir: "out/finalnet/"

figures:
  directory: "figs"
  combined_network: 
    filename: "combined_network.png"
  final_network:
    filename: "distribution_network.png"